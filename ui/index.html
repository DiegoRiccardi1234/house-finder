<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monitor annunci affitto multi-canale con giudizio AI e dashboard locale." />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234a6b52'/%3E%3Cpath d='M8 15.5 16 9l8 6.5V24a1 1 0 0 1-1 1h-4.5v-6h-5v6H9a1 1 0 0 1-1-1z' fill='%23f7f7f4'/%3E%3C/svg%3E"
    />
    <title>House Finder</title>
    <script>
      // Anti-flash: applica il tema prima del primo paint, altrimenti in dark si
      // vede un lampo chiaro a ogni caricamento.
      (function () {
        try {
          var c = localStorage.getItem('hf-theme') || 'system';
          var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
